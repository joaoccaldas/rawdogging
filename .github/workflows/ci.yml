name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check game modules
        run: |
          find js -type f -name '*.js' -print0 | while IFS= read -r -d '' file; do
            node --check "$file"
          done
      - name: Enforce repository boundary
        run: |
          ! grep -R --line-number -E 'CaldasGO|Pok[eé]Stop|TrainerAvatar' .             --exclude-dir=.git             --exclude='README.md'
